name: Build Rumigram Desktop

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build environment
        shell: cmd
        run: |
          mkdir %USERPROFILE%\TBuild
          mkdir %USERPROFILE%\TBuild\Libraries
          mkdir %USERPROFILE%\TBuild\Libraries\win64
          mkdir %USERPROFILE%\TBuild\ThirdParty

      - name: Configure CMake
        shell: cmd
        run: |
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build Project
        shell: cmd
        run: |
          cmake --build out --config Release --parallel

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rumigram-Windows-x64
          path: |
            out/Release/Rumigram.exe
            out/Release/*.exe
